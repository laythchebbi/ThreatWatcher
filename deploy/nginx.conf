# Threat Watcher — nginx reverse proxy
#
# - Public terminates TLS here; backend + frontend bind to 127.0.0.1 only.
# - /metrics on the backend is restricted to the Prometheus host (set
#   $prom_allow below) so /metrics is never exposed publicly.
# - HSTS, strong TLS, modern ciphers.
#
# Install:
#   sudo ln -s /opt/threat-watcher/deploy/nginx.conf /etc/nginx/sites-enabled/threat-watcher.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS cert: provision via certbot (Let's Encrypt) for both hostnames.

upstream tw_backend  { server 127.0.0.1:3000 keepalive 16; }
upstream tw_frontend { server 127.0.0.1:4000 keepalive 16; }

# Replace with your monitoring host's IP (or CIDR block)
geo $prom_allow {
    default 0;
    127.0.0.1 1;
    10.0.0.0/8 1;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    server_name threatwatcher.example.com api.threatwatcher.example.com;
    return 301 https://$host$request_uri;
}

# ── Frontend (user-facing) ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name threatwatcher.example.com;

    ssl_certificate     /etc/letsencrypt/live/threatwatcher.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/threatwatcher.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 1m;
    proxy_read_timeout 60s;
    proxy_buffering on;

    location / {
        proxy_pass http://tw_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Frontend metrics (Prometheus only)
    location = /metrics {
        if ($prom_allow = 0) { return 404; }
        proxy_pass http://tw_frontend/metrics;
    }

    # Long-cache static assets
    location /static/ {
        proxy_pass http://tw_frontend;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# ── Backend API ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.threatwatcher.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.threatwatcher.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.threatwatcher.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://tw_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Backend metrics (Prometheus only)
    location = /metrics {
        if ($prom_allow = 0) { return 404; }
        proxy_pass http://tw_backend/metrics;
    }
}
